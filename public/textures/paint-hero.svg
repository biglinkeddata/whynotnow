<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Recreation of the brand's acrylic canvas: yellow field, blue blocks,
       red/crimson/orange fields, white impasto. Type zones stay calmer. -->
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.012" numOctaves="3" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="60" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="impasto" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.04" numOctaves="4" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="55" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- yellow canvas base -->
  <rect width="1600" height="900" fill="#F2B21C"/>
  <!-- warmer wash lower left, like the canvas -->
  <g filter="url(#rough)" opacity="0.55">
    <path d="M -80 620 C 240 560 520 680 820 600 L 860 900 L -80 900 Z" fill="#E88A17"/>
  </g>

  <!-- blue block, top left -->
  <g filter="url(#rough2)" opacity="0.96">
    <path d="M 30 60 Q 260 30 420 55 Q 450 200 430 330 Q 220 370 60 340 Q 20 200 30 60 Z" fill="#1E50B0"/>
    <path d="M 120 120 Q 260 100 360 115 Q 380 200 370 270 Q 240 295 140 280 Q 110 200 120 120 Z" fill="#2E66CC" opacity="0.7"/>
  </g>
  <!-- small blue drips centre-bottom -->
  <g filter="url(#rough2)" opacity="0.85">
    <path d="M 700 770 Q 790 750 860 765 Q 875 830 865 900 L 710 900 Q 690 830 700 770 Z" fill="#1E50B0"/>
  </g>

  <!-- red field, left middle -->
  <g filter="url(#rough)" opacity="0.9">
    <path d="M -80 380 C 60 350 180 380 260 360 L 280 560 C 160 600 40 570 -80 600 Z" fill="#E42418"/>
  </g>
  <!-- crimson band, right of middle -->
  <g filter="url(#rough)" opacity="0.92">
    <path d="M 900 480 C 1100 430 1350 500 1700 440 L 1700 700 C 1400 760 1150 690 920 740 Z" fill="#C41E3A"/>
  </g>
  <!-- big orange-red shape, top right -->
  <g filter="url(#rough2)" opacity="0.9">
    <path d="M 1060 -40 C 1180 20 1240 140 1180 260 C 1120 340 1000 300 960 200 C 930 100 980 -20 1060 -40 Z" fill="#E8491C"/>
    <path d="M 1320 -60 C 1480 -20 1600 80 1700 40 L 1700 320 C 1560 380 1400 300 1300 200 Z" fill="#E88A17"/>
  </g>
  <!-- magenta smudge accents -->
  <g filter="url(#rough2)" opacity="0.8">
    <path d="M 1250 380 C 1330 360 1400 400 1450 380 L 1460 450 C 1390 480 1310 450 1250 470 Z" fill="#E81F5C"/>
  </g>

  <!-- white impasto patches -->
  <g filter="url(#impasto)" fill="#FFFFFF">
    <path d="M 1180 120 C 1240 100 1300 140 1280 200 C 1250 260 1160 240 1150 180 Z" opacity="0.85"/>
    <path d="M 1050 320 C 1110 300 1170 330 1150 380 C 1120 430 1040 410 1030 360 Z" opacity="0.7"/>
    <path d="M 560 640 C 640 620 700 660 680 710 C 650 760 560 740 550 690 Z" opacity="0.75"/>
    <path d="M 170 180 C 200 170 230 190 220 215 C 205 240 165 230 160 205 Z" opacity="0.8"/>
    <path d="M 1420 560 C 1480 545 1530 575 1515 615 C 1490 655 1410 635 1405 595 Z" opacity="0.6"/>
  </g>

  <!-- calm the centre-left column where hero type sits -->
  <g filter="url(#rough)" opacity="0.5">
    <path d="M 60 380 C 300 340 560 420 780 370 L 800 720 C 560 780 280 700 60 760 Z" fill="#F2B21C"/>
  </g>
  <rect width="1600" height="900" fill="#F2B21C" opacity="0.14"/>
</svg>
