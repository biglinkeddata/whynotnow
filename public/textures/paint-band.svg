<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice">
  <!-- Band variant of the brand canvas: yellow field, blue block, red/orange. -->
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.05" numOctaves="3" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="50" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="impasto" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.04" numOctaves="4" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="50" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="1600" height="520" fill="#F2B21C"/>
  <g filter="url(#rough)" opacity="0.94">
    <path d="M 40 40 Q 240 15 380 40 Q 405 170 390 290 Q 200 325 60 300 Q 25 170 40 40 Z" fill="#1E50B0"/>
  </g>
  <g filter="url(#rough)" opacity="0.9">
    <path d="M 900 300 C 1100 250 1350 330 1700 270 L 1700 520 L 900 520 Z" fill="#C41E3A"/>
  </g>
  <g filter="url(#rough)" opacity="0.9">
    <path d="M 1150 -60 C 1300 -20 1450 60 1700 10 L 1700 200 C 1500 260 1300 180 1150 220 Z" fill="#E8491C"/>
  </g>
  <g filter="url(#rough)" opacity="0.85">
    <path d="M -80 380 C 120 350 300 400 480 370 L 500 520 L -80 520 Z" fill="#E42418"/>
  </g>
  <g filter="url(#impasto)" fill="#FFFFFF">
    <path d="M 1090 90 C 1150 70 1210 105 1190 160 C 1160 215 1075 195 1065 140 Z" opacity="0.8"/>
    <path d="M 620 330 C 690 310 750 345 730 395 C 700 445 615 425 605 375 Z" opacity="0.7"/>
  </g>
  <rect width="1600" height="520" fill="#F2B21C" opacity="0.15"/>
</svg>
